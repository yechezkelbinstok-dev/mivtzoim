<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>מבצעים — רישום</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">מבצעים</div>
      <nav class="tabs">
        <a href="index.html" aria-current="page">רישום</a>
        <a href="dashboard.html">לוח</a>
      </nav>
      <div class="spacer"></div>
      <div class="save-state" id="saveState" data-state="idle">
        <span class="dot"></span><span id="saveText"></span>
      </div>
      <button class="icon-btn" id="tokenBtn" title="טוקן">🔑</button>
    </header>

    <main class="entry">
      <aside class="rail panel">
        <div class="rail-head">
          <div class="week-line">
            <span class="week-id" id="weekId">—</span>
            <button class="link-btn" id="importBtn">ייבוא</button>
          </div>
          <div class="routes" id="routes"></div>
        </div>
        <div class="search-wrap">
          <input type="search" id="search" placeholder="חיפוש כתובת" autocomplete="off" />
        </div>
        <div class="addr-list" id="addrList"></div>
      </aside>

      <section class="work panel" id="work">
        <div class="empty" id="workEmpty">
          <button class="drop drop-cta" id="emptyImport">door_log.csv</button>
        </div>
        <div id="workCard" hidden>
          <div class="work-head">
            <div style="flex: 1; min-width: 0">
              <div class="addr-big ltr" id="cardAddr"></div>
              <div class="meta-line" id="cardMeta"></div>
            </div>
          </div>

          <div class="field">
            <div class="choices" id="fAnswered">
              <button class="choice pos" data-value="true" aria-pressed="false">ענו</button>
              <button class="choice neg" data-value="false" aria-pressed="false">לא ענו</button>
            </div>
          </div>

          <div class="field">
            <div class="choices" id="fJewish">
              <button class="choice pos" data-value="true" aria-pressed="false">יהודי</button>
              <button class="choice neg" data-value="false" aria-pressed="false">לא יהודי</button>
            </div>
          </div>

          <div class="field">
            <div class="label">עניין</div>
            <div class="choices" id="fInterest">
              <button class="choice" data-value="none" aria-pressed="false">בכלל לא</button>
              <button class="choice" data-value="some" aria-pressed="false">קצת</button>
              <button class="choice" data-value="a_lot" aria-pressed="false">הרבה</button>
            </div>
          </div>

          <div class="field">
            <div class="label">הערות</div>
            <textarea class="notes" id="fNotes"></textarea>
          </div>

          <div class="actions">
            <button class="btn-primary" id="saveBtn">שמור</button>
            <button class="btn-ghost" id="skipBtn">דלג</button>
          </div>

          <div class="history" id="history" hidden>
            <div class="label">היסטוריה</div>
            <div id="historyRows"></div>
          </div>
        </div>
      </section>
    </main>

    <div class="overlay" id="tokenOverlay" hidden>
      <div class="dialog narrow">
        <div class="key-icon">🔑</div>
        <h2>טוקן</h2>
        <input type="password" id="tokenInput" autocomplete="off" spellcheck="false" />
        <div class="status-label" id="tokenStatus"></div>
        <div class="row">
          <button class="btn-primary" id="tokenSave">אישור</button>
          <button class="btn-ghost" id="tokenClear">מחיקה</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="importOverlay" hidden>
      <div class="dialog">
        <h2>ייבוא מסלולים</h2>
        <div class="drop" id="drop">door_log.csv</div>
        <input type="file" id="fileInput" accept=".csv,text/csv" hidden />
        <textarea class="csv" id="csvText" spellcheck="false"></textarea>
        <div class="status-label" id="importStatus"></div>
        <div class="row">
          <button class="btn-primary" id="importDo">ייבוא</button>
          <button class="btn-ghost" id="importCancel">ביטול</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/entry.js"></script>
  </body>
</html>
